name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_FIREBASE_API_KEY: "AIzaSyANjmBDEotl2BTMi_8mJ7cyCc9RK7Y7KXM"
      VITE_FIREBASE_AUTH_DOMAIN: vaasal-villa.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: vaasal-villa
      VITE_FIREBASE_APP_ID: "1:677358674069:web:cb36a839284e996576fb9c"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Add GitHub Pages route fallback
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
